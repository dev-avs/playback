[package]
name = "playback-core"
version = "0.1.0"
description = "Playback's backend, shared by the Tauri and GPUI builds"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
regex = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt", "time", "net", "io-util", "sync", "macros", "process"] }
sha2 = "0.10"
getrandom = "0.3"
flate2 = "1"
aes-gcm = "0.10"
lindera = { version = "6", default-features = false, features = ["embed-ipadic"] }
windows = { version = "0.62", features = [
  "Foundation",
  "Media",
  "Media_Control",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Media_Audio",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_WinRT",
  "Win32_UI_WindowsAndMessaging",
] }
