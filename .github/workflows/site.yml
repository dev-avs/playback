# Rebuilds the website (dev-avs/playback-site on Vercel) after each release.
# The site copies the changelog and some of the app's code from this repo when
# it builds, so without a rebuild it keeps showing the previous release.
name: Rebuild website

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - run: curl -fsS -X POST "$HOOK" > /dev/null
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
