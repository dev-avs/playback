<!doctype html><html><head><meta charset="utf-8"><style>
/* harness: transparent page, no margins (src/App.css:101 .stage pads the card by 22px) */
html, body { margin: 0; background: transparent; overflow: hidden; }
.stage { display: flex; flex-direction: column; align-items: flex-start; padding: 22px; background: transparent; }
/* src/App.css:24-48 */
@font-face { font-family: "SF Pro Text"; font-weight: 300; src: local("SF Pro Text Light"), local("SF-Pro-Text-Light"); }
@font-face { font-family: "SF Pro Text"; font-weight: 400; src: local("SF Pro Text Regular"), local("SF-Pro-Text-Regular"); }
@font-face { font-family: "SF Pro Text"; font-weight: 500; src: local("SF Pro Text Medium"), local("SF-Pro-Text-Medium"); }
@font-face { font-family: "SF Pro Text"; font-weight: 600; src: local("SF Pro Text Semibold"), local("SF-Pro-Text-Semibold"); }
@font-face { font-family: "SF Pro Text"; font-weight: 700; src: local("SF Pro Text Bold"), local("SF-Pro-Text-Bold"); }
/* src/windows/Settings.css:16 .st-card font stack (buttons inherit it, :33-35); :123-137 .st-nav-item
   11.5px 600 rgba(255,255,255,.7); a button's line-height is normal (UA stylesheet); text src/windows/Settings.tsx:195.
   harness: the label alone, no button box, icon or count */
.stage { font-family: "SF Pro", "SF Pro Text", "SF Pro Display", -apple-system, "Segoe UI", sans-serif; }
.st-nav-item { font-size: 11.5px; font-weight: 600; color: rgba(255, 255, 255, 0.7); line-height: normal; white-space: nowrap; }
</style></head><body><div class="stage"><span class="st-nav-item">Lyric text</span></div></body></html>
