<!doctype html><html><head><meta charset="utf-8"><style>
/* harness: transparent page, no margins (src/App.css:101 .stage pads the card by 22px) */
html, body { margin: 0; background: transparent; overflow: hidden; }
.stage { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 22px; background: transparent; }
/* src/windows/Settings.css:429-444 .st-reset-pill: radius 999px, background, inset 0.5px hairline.
   The size is a harness stand-in for the text (padding 2px 10px around a 13.75px line, Settings.css:412). */
.pill { box-sizing: border-box; width: 96px; height: 17.75px; border-radius: 999px;
  background: rgba(255, 90, 70, 0.28); box-shadow: inset 0 0 0 0.5px rgba(255, 120, 100, 0.5); }
/* src/windows/Settings.css:472-476 .st-reset-done .st-reset-pill */
.pill.done { background: rgba(70, 200, 120, 0.55); box-shadow: inset 0 0 0 0.5px rgba(120, 230, 160, 0.6); }
/* src/windows/Settings.css:298-306 .st-info-tile: radius 10px, background, inset hairline (harness size) */
.tile { box-sizing: border-box; width: 120px; height: 40px; border-radius: 10px;
  background: rgba(255, 255, 255, 0.06); box-shadow: inset 0 0 0 0.5px rgba(255, 255, 255, 0.08); }
</style></head><body><div class="stage"><div class="pill"></div><div class="pill done"></div><div class="tile"></div></div></body></html>
