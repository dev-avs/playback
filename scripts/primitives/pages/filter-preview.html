<!doctype html><html><head><meta charset="utf-8"><style>
/* harness: transparent page, no margins (src/App.css:101 .stage pads the card by 22px); src/index.css:1 border-box */
html, body { margin: 0; background: transparent; overflow: hidden; }
* { box-sizing: border-box; }
.stage { display: block; padding: 22px; background: transparent; }
/* src/windows/Settings.css:502-516 .st-preview: relative, overflow hidden, height 176px, border-box, column,
   radius var(--pv-radius, 10px), padding 8px 10px 10px, background rgba(var(--pv-tint, 20, 20, 22), var(--bg-a))
   (--bg-a at its default .72; the box-shadow belongs to the shadow cases); width 300px is a harness size */
.st-preview { position: relative; overflow: hidden; height: 176px; width: 300px; display: flex; flex-direction: column;
  border-radius: 10px; padding: 8px 10px 10px; background: rgba(20, 20, 22, 0.72); }
/* src/windows/Settings.css:517-524 .st-preview-bg: absolute, inset -40px, cover, centred,
   filter var(--pv-cover-filter, blur(30px) saturate(1.4)), opacity calc(.55 * var(--bg-k)) (--bg-k 1 at the
   default Background); --pv-cover-filter at the defaults (src/windows/Settings.tsx:366) */
.st-preview-bg { position: absolute; inset: -40px; background-image: url(../../../fixtures/fake-cover.png); background-size: cover;
  background-position: center; filter: blur(30px) saturate(1.4) brightness(1); opacity: 0.55; }
</style></head><body><div class="stage"><div class="st-preview"><div class="st-preview-bg"></div></div></div></body></html>
