<!doctype html><html><head><meta charset="utf-8"><style>
/* harness: transparent page, no margins (src/App.css:101 .stage pads the card by 22px) */
html, body { margin: 0; background: transparent; overflow: hidden; }
.stage { display: block; padding: 22px; background: transparent; }
/* src/App.css:2504-2533 .next-popup: radius 8px, background rgba(255,255,255,.2), the entry animation.
   The size is a harness stand-in; scale (.77), backdrop-filter and box-shadow belong to other helpers. */
.next-popup { width: 140px; height: 56px; border-radius: 8px; background: rgba(255, 255, 255, 0.2);
  animation: next-popup-in 320ms cubic-bezier(0.2, 0.8, 0.2, 1) both; }
.stage:not(.show) .next-popup { display: none; }
/* src/App.css:2558-2561 */
@keyframes next-popup-in {
    from { opacity: 0; transform: translateX(16px); }
    to { opacity: 1; transform: none; }
}
</style></head><body><div class="stage"><div class="next-popup"></div></div></body></html>
