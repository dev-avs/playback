<!doctype html><html><head><meta charset="utf-8"><style>
/* harness: transparent page, no margins (src/App.css:101 .stage pads the card by 22px) */
html, body { margin: 0; background: transparent; overflow: hidden; }
.stage { display: block; padding: 22px; background: transparent; }
/* src/App.css:1558-1564 */
.art-mini-bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; flex-shrink: 0; }
/* src/App.css:1566-1576 */
.art-mini-bars span { display: block; width: 3px; height: 3px; border-radius: 1.5px; background: rgba(255, 255, 255, 0.85); animation: none; }
/* src/App.css:1580-1587 */
.art-mini-bars.playing span { animation: bar-pulse 1.1s ease-in-out infinite alternate; }
.art-mini-bars.playing span:nth-child(1) { animation-delay: 0s; }
.art-mini-bars.playing span:nth-child(2) { animation-delay: 0.18s; }
.art-mini-bars.playing span:nth-child(3) { animation-delay: 0.36s; }
.art-mini-bars.playing span:nth-child(4) { animation-delay: 0.54s; }
.art-mini-bars.playing span:nth-child(5) { animation-delay: 0.72s; }
/* src/App.css:1600-1606 */
@keyframes bar-pulse {
    0%   { height: 3px; }
    25%  { height: 8px; }
    50%  { height: 5px; }
    75%  { height: 14px; }
    100% { height: 8px; }
}
</style></head><body><div class="stage"><div class="art-mini-bars"><span></span><span></span><span></span><span></span><span></span></div></div></body></html>
