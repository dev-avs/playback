<!doctype html><html><head><meta charset="utf-8"><style>
/* harness: transparent page, no margins (src/App.css:101 .stage pads the card by 22px) */
html, body { margin: 0; background: transparent; overflow: hidden; }
.stage { display: block; padding: 22px; background: transparent; }
/* src/App.css:999-1018 .vol-pill: background, radius 8px, the entry animation. The size is a harness
   stand-in; the box-shadow belongs to the box-shadow helper. */
.vol-pill { width: 120px; height: 36px; border-radius: 8px; background: rgba(20, 20, 22, 0.72);
  animation: vol-pill-in 160ms cubic-bezier(0.4, 0, 0.2, 1) forwards; }
.stage:not(.show) .vol-pill { display: none; }
/* src/App.css:1051-1054 */
@keyframes vol-pill-in {
    from { opacity: 0; transform: translateY(3px); }
    to   { opacity: 1; transform: translateY(0); }
}
</style></head><body><div class="stage"><div class="vol-pill"></div></div></body></html>
