<!doctype html><html><head><meta charset="utf-8"><style>
/* harness: transparent page, no margins (src/App.css:101 .stage pads the card by 22px) */
html, body { margin: 0; background: transparent; overflow: hidden; }
.stage { display: block; padding: 22px; background: transparent; }
/* src/App.css:115-131 .widget (background, radius, transitions); the size is a harness stand-in for the content */
.widget { background: rgba(20, 20, 22, 0.72); border-radius: 13px; width: 200px; height: 80px;
  transition: background 400ms ease, opacity 300ms ease; }
/* src/App.css:135 .widget:not(.hovered) { opacity: var(--rest-opacity) }; 0.2 = restOpacity 20, the slider min (src/windows/Settings.tsx:1035) */
.widget:not(.hovered) { opacity: 0.2; }
</style></head><body><div class="stage"><div class="widget hovered"></div></div></body></html>
