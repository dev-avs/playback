[package]
name = "playback-gpui"
version = "0.1.0"
description = "Playback, native GPUI build (Project Phoenix)"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

# `[[bin]] name` is the file name of the built exe on Windows: target/<profile>/Playback.exe.
[[bin]]
name = "Playback"
path = "src/main.rs"

[dependencies]
gpui = "=0.2.2"
playback-core = { path = "../crates/playback-core" }
playback-logic = { path = "./logic" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.17"
raw-window-handle = "0.6"
log = "0.4"
async-channel = "2"
tokio = { version = "1", features = ["rt", "time"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Media",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
] }

# Its own workspace (like src-tauri, whose target dir and pack paths stay put); `logic` is a path
# dependency inside this directory, so it is a member and `cargo test` works from here or from logic/.
[workspace]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
