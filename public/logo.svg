<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="player">
  <!--
    The widget in miniature: its dark glass over a soft blur of cover colour,
    with the album-mode visualizer's rounded white bars. Four bars and no other
    detail, so it still reads at 16px.
  -->
  <defs>
    <radialGradient id="p" cx="18" cy="16" r="36" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#e0408f"/>
      <stop offset="1" stop-color="#e0408f" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="b" cx="50" cy="52" r="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3f6bff"/>
      <stop offset="1" stop-color="#3f6bff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="c"><rect x="2" y="2" width="60" height="60" rx="14"/></clipPath>
  </defs>

  <!-- glass: dark base, two colour glows, a dimming wash like .widget's tint -->
  <g clip-path="url(#c)">
    <rect width="64" height="64" fill="#18181b"/>
    <rect width="64" height="64" fill="url(#p)" opacity=".9"/>
    <rect width="64" height="64" fill="url(#b)" opacity=".9"/>
    <rect width="64" height="64" fill="#141416" opacity=".3"/>
  </g>
  <rect x="2.5" y="2.5" width="59" height="59" rx="13.5" fill="none" stroke="#fff" stroke-opacity=".14"/>

  <!-- visualizer bars, bottom-aligned like .art-mini-bars -->
  <g fill="#fff">
    <rect x="14" y="35" width="6" height="12" rx="3"/>
    <rect x="24" y="23" width="6" height="24" rx="3"/>
    <rect x="34" y="29" width="6" height="18" rx="3"/>
    <rect x="44" y="17" width="6" height="30" rx="3"/>
  </g>
</svg>
