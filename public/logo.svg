<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Playback">
  <!--
    Three lines of a song on a black tile, the middle one being sung: the
    lyrics, mid-sweep, the way the widget shows them. Black and white only, and
    nothing finer than the side lines, so it still reads at 16px.
  -->
  <rect width="64" height="64" rx="15" fill="#0b0b0d"/>
  <rect x=".5" y=".5" width="63" height="63" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".14"/>
  <g stroke-linecap="round">
    <line x1="17" y1="18" x2="40" y2="18" stroke="#fff" stroke-opacity=".28" stroke-width="5"/>
    <line x1="13" y1="32" x2="51" y2="32" stroke="#fff" stroke-opacity=".28" stroke-width="9"/>
    <line x1="13" y1="32" x2="37" y2="32" stroke="#fff" stroke-width="9"/>
    <line x1="17" y1="46" x2="34" y2="46" stroke="#fff" stroke-opacity=".28" stroke-width="5"/>
  </g>
</svg>
