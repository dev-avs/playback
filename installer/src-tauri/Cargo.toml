[package]
name = "playback-installer"
version = "1.0.0"
description = "Installs Playback: picks a folder and options, then runs the newest release's own installer"
edition = "2021"
license = "AGPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "process"] }
dirs = "6"
winreg = "0.55"

# Small, since people download it.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
